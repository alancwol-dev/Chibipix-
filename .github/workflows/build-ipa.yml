# Builds an unsigned ChibiPix.ipa on a GitHub-hosted Mac and publishes it as a release.
# Latest build: https://github.com/<owner>/<repo>/releases/latest/download/ChibiPix.ipa
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build unsigned IPA
        run: ./scripts/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChibiPix-ipa
          path: build/ChibiPix.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/ChibiPix.ipa \
            --title "ChibiPix build ${{ github.run_number }}" \
            --notes "Unsigned IPA from ${GITHUB_SHA::7}. Sign and install with Sideloadly or AltStore." \
            --latest
